# Builds Blendity for Windows, Linux and macOS, runs the unit tests and a quick
# stress pass, and uploads the three executables as artifacts. A Linux job runs the
# unit tests under AddressSanitizer + UndefinedBehaviorSanitizer.
# The windows, linux and macos jobs are required checks for merging into main; linux-sanitizers
# blocks too and joins them once task 0002 is merged.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (MSVC, no CMake needed)
        shell: cmd
        run: build.bat release all
      - name: Unit tests
        shell: bash
        # Each failing check also becomes an annotation, readable without signing in.
        run: |
          set +e
          dist/windows/blendity_tests.exe 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          grep -E '^\[FAIL\]|^  FAIL |runtime error|ERROR: AddressSanitizer' tests.log | head -50 | sed 's/^ */::error::/'
          exit $status
      - name: Quick stress test
        shell: bash
        timeout-minutes: 20
        # 15 minutes at most (it takes about one); where it stopped is shown as annotations.
        run: |
          set +e
          perl -e 'alarm shift; exec @ARGV' 900 dist/windows/blendity_stress.exe --quick --out stress/results/ci 2>&1 | tee stress.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::stress exited with $status (142 = timed out)"
            grep '^\[stress\]' stress.log | tail -3 | sed 's/^/::error::/'
            tail -5 stress.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Headless screenshot
        run: dist\windows\Blendity.exe --headless-screenshot screenshot-windows.png
      - uses: actions/upload-artifact@v4
        with:
          name: blendity-windows
          path: |
            dist/windows/*.exe
            screenshot-windows.png
            stress/results/ci

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler + X11 headers
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev fonts-dejavu-core
      - name: Build
        run: ./build.sh release all
      - name: Unit tests
        shell: bash
        # Each failing check also becomes an annotation, readable without signing in.
        run: |
          set +e
          ./dist/linux/blendity_tests 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          grep -E '^\[FAIL\]|^  FAIL |runtime error|ERROR: AddressSanitizer' tests.log | head -50 | sed 's/^ */::error::/'
          exit $status
      - name: Quick stress test
        shell: bash
        timeout-minutes: 20
        # 15 minutes at most (it takes about one); where it stopped is shown as annotations.
        run: |
          set +e
          perl -e 'alarm shift; exec @ARGV' 900 ./dist/linux/blendity_stress --quick --out stress/results/ci 2>&1 | tee stress.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::stress exited with $status (142 = timed out)"
            grep '^\[stress\]' stress.log | tail -3 | sed 's/^/::error::/'
            tail -5 stress.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Headless screenshot
        run: ./dist/linux/Blendity --headless-screenshot screenshot-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: blendity-linux
          path: |
            dist/linux/Blendity
            dist/linux/blendity_stress
            dist/linux/blendity_tests
            screenshot-linux.png
            stress/results/ci

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh release all
      - name: Unit tests
        shell: bash
        # Each failing check also becomes an annotation, readable without signing in.
        run: |
          set +e
          ./dist/macos/blendity_tests 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          grep -E '^\[FAIL\]|^  FAIL |runtime error|ERROR: AddressSanitizer' tests.log | head -50 | sed 's/^ */::error::/'
          exit $status
      - name: Quick stress test
        shell: bash
        timeout-minutes: 20
        # 15 minutes at most (it takes about one); where it stopped is shown as annotations.
        run: |
          set +e
          perl -e 'alarm shift; exec @ARGV' 900 ./dist/macos/blendity_stress --quick --out stress/results/ci 2>&1 | tee stress.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::stress exited with $status (142 = timed out)"
            grep '^\[stress\]' stress.log | tail -3 | sed 's/^/::error::/'
            tail -5 stress.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Headless screenshot
        run: ./dist/macos/Blendity --headless-screenshot screenshot-macos.png
      - name: Zip app bundle
        run: cd dist/macos && zip -r Blendity-macos.zip Blendity.app
      - uses: actions/upload-artifact@v4
        with:
          name: blendity-macos
          path: |
            dist/macos/Blendity-macos.zip
            dist/macos/blendity_stress
            dist/macos/blendity_tests
            screenshot-macos.png
            stress/results/ci

  # Unit tests under AddressSanitizer + UndefinedBehaviorSanitizer: out-of-range indices, use after
  # free and undefined behaviour. Blocking since task 0002 fixed its findings.
  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler + X11 headers
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev fonts-dejavu-core
      - name: Build the tests with sanitizers
        env:
          EXTRA_FLAGS: -O1 -fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer
        run: ./build.sh debug tests
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        shell: bash
        # Each failing check also becomes an annotation, readable without signing in.
        run: |
          set +e
          ./dist/linux/blendity_tests 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          grep -E '^\[FAIL\]|^  FAIL |runtime error|ERROR: AddressSanitizer' tests.log | head -50 | sed 's/^ */::error::/'
          exit $status
