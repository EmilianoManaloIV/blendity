name: build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-material-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare normal Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev libxi-dev fonts-dejavu-core ccache
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-material-verification
          restore-keys: ccache-linux-main-
      - name: Build dependency-free unit suite
        env:
          BLENDITY_NO_LIBS: '1'
          CXX: ccache g++
          CC: ccache gcc
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ./build.sh release tests
      - name: Verify extracted and split images under configured and fallback roots
        shell: bash
        run: |
          set -euo pipefail
          for mode in configured fallback; do
            export BLENDITY_TEST_DIR="$RUNNER_TEMP/material test/$mode"
            export BLENDITY_CACHE_DIR="$RUNNER_TEMP/explicit import cache"
            expected="$BLENDITY_CACHE_DIR/import"
            if [[ "$mode" == fallback ]]; then
              export BLENDITY_CACHE_DIR=""
              expected="$BLENDITY_TEST_DIR/home/.blendity/cache/import"
            fi
            mkdir -p "$BLENDITY_TEST_DIR"
            BLENDITY_TEST_FILTER='a packed map is split' ./dist/linux/blendity_tests --group assets | tee "$RUNNER_TEMP/$mode.log"
            grep -Fx '3 checks, 0 failed' "$RUNNER_TEMP/$mode.log"
            test "$(find "$expected" -type f -name packed_rough.png | wc -l)" -eq 1
            file=$(find "$expected" -type f -name packed_rough.png)
            test -f "$(dirname "$file")/diffuse.png"
            test -f "$(dirname "$file")/diffuse 2.png"
          done
      - name: Run related groups
        run: |
          for group in assets editor; do
            export BLENDITY_TEST_DIR="$RUNNER_TEMP/groups/$group"
            mkdir -p "$BLENDITY_TEST_DIR"
            BLENDITY_CACHE_DIR="$BLENDITY_TEST_DIR/cache" ./dist/linux/blendity_tests --group "$group"
          done
