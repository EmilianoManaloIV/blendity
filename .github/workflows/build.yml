name: Windows release compatibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Provision the original MSVC toolset if absent
        run: |
          $finder = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $instances = & $finder -all -products '*' -property installationPath
          foreach ($instance in $instances) {
            if (Test-Path "$instance/VC/Tools/MSVC/14.52.37025/bin/Hostx64/x64/cl.exe") {
              Write-Host "Preinstalled toolset at $instance"
              return
            }
          }
          $package = "$env:RUNNER_TEMP/vs_BuildTools.exe"
          Invoke-WebRequest -Uri 'https://download.visualstudio.microsoft.com/download/pr/4aa37a90-1dc9-4507-9e7b-49134341b6c4/5e7c32e82c89b3d69a2c818f3b06679909729b05e94609e3367bbb554d627f55/vs_BuildTools.exe' -OutFile $package
          if ((Get-FileHash $package).Hash -ne '5e7c32e82c89b3d69a2c818f3b06679909729b05e94609e3367bbb554d627f55') { throw 'Bootstrapper hash mismatch' }
          $signature = Get-AuthenticodeSignature $package
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Expected a Microsoft-signed bootstrapper' }
          $process = Start-Process $package -WindowStyle Hidden -Wait -PassThru -ArgumentList '--quiet','--wait','--norestart','--nocache','--installPath','C:\blendity-buildtools','--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64','--add','Microsoft.VisualStudio.Component.Windows11SDK.26100'
          if ($process.ExitCode -notin 0,3010) { throw "Build Tools installer exited $($process.ExitCode)" }
          if (!(Test-Path 'C:/blendity-buildtools/VC/Tools/MSVC/14.52.37025/bin/Hostx64/x64/cl.exe')) { throw 'The original compiler is missing after provisioning' }
      - name: Build with precise floating-point semantics
        env:
          BLENDITY_VCVARS_VER: '14.52.37025'
          BLENDITY_VCVARS_STRICT: '1'
          BLENDITY_NO_LIBS: '1'
          BLENDITY_FETCH_OPTIX: '1'
          _CL_: '/fp:precise'
        run: |
          Write-Host "Compiler option override: $env:_CL_"
          cmd /d /c "build.bat release all"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-build
          retention-days: 3
          path: dist/windows/
  validate:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, stress]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-build
          path: dist/windows
      - name: Run release checks
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "verification-$env:SUITE"
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $env:BLENDITY_PROJECT = "$scratch/project"
          $env:BLENDITY_TRASH = "$scratch/trash"
          $env:BLENDITY_TEST_DIR = "$scratch/tests"
          $env:BLENDITY_CACHE_DIR = "$scratch/cache"
          $env:BLENDITY_PREFS_DIR = "$scratch/prefs"
          if ($env:SUITE -eq 'unit') {
            & dist/windows/blendity_tests.exe
          } else {
            & dist/windows/blendity_stress.exe --quick --out "$scratch/results"
          }
          exit $LASTEXITCODE
