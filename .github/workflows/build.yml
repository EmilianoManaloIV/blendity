name: Task 0571 Linux quick stress
on: workflow_dispatch
permissions:
  contents: read

jobs:
  linux-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDITY_NO_LIBS: "1"
      BLENDITY_NO_OPTIX: "1"
      BLENDITY_THREADS: "4"
      CUDA_VISIBLE_DEVICES: "-1"
      MALLOC_ARENA_MAX: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libx11-dev libxi-dev fonts-dejavu-core time
      - name: Build the candidate's dependency-free Release stress runner
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/0571-evidence"
          mkdir -p "$evidence"
          git diff --exit-code HEAD^ HEAD -- . ':(exclude).github/workflows/build.yml'
          git rev-parse HEAD HEAD^ > "$evidence/revisions.txt"
          g++ --version > "$evidence/compiler.txt"
          bash build.sh release stress > "$evidence/build.log" 2>&1
          sha256sum dist/linux/blendity_stress > "$evidence/sha256.txt"
      - name: Run all quick sections on four CPUs in scratch
        timeout-minutes: 25
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/0571-evidence"
          scratch="$RUNNER_TEMP/0571-run"
          mkdir -p "$scratch"/{temp,project,trash,prefs,cache,cuda,optix} "$evidence/report"
          export TMPDIR="$scratch/temp" BLENDITY_PROJECT="$scratch/project" BLENDITY_TRASH="$scratch/trash"
          export BLENDITY_PREFS_DIR="$scratch/prefs" BLENDITY_CACHE_DIR="$scratch/cache"
          export CUDA_CACHE_PATH="$scratch/cuda" OPTIX_CACHE_PATH="$scratch/optix"
          cpus=$(python3 -c 'import os; ids=sorted(os.sched_getaffinity(0)); assert len(ids)>=4, ids; print(",".join(map(str,ids[:4])))')
          exe="$GITHUB_WORKSPACE/dist/linux/blendity_stress"
          cd "$scratch"
          printf 'taskset -c %s %s --quick --threads 4 --out %s\n' "$cpus" "$exe" "$evidence/report" > "$evidence/command.txt"
          free -k > "$evidence/memory-before.txt"
          status=0
          /usr/bin/time -v -o "$evidence/time.txt" taskset -c "$cpus" "$exe" --quick --threads 4 --out "$evidence/report" > "$evidence/stdout.log" 2> "$evidence/stderr.log" || status=$?
          echo "$status" > "$evidence/exit.txt"
          tail -4 "$evidence/stderr.log"
          test "$status" = 0
          grep -Eq '^Threads: 4[[:space:]]*$' "$evidence/report/latest.md"
          grep -Eq '^Mode: quick[[:space:]]*$' "$evidence/report/latest.md"
          grep '^Total run time:' "$evidence/report/latest.md"
          awk '/^\[stress\] .* started at /{print $2}' "$evidence/stderr.log" > "$evidence/started.txt"
          awk '/^\[stress\] .* done at /{print $2}' "$evidence/stderr.log" > "$evidence/completed.txt"
          diff -u "$evidence/started.txt" "$evidence/completed.txt"
          test "$(sort -u "$evidence/completed.txt" | wc -l)" -eq 48
          test "$(wc -l < "$evidence/completed.txt")" -eq 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-0571-linux-quick
          path: ${{ runner.temp }}/0571-evidence
