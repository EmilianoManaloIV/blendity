name: Windows toolset verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f880bb3bdcc4fdb9e5b79a000334598644ab6bd
      - name: Compile the release baseline and keep symbols
        env:
          BLENDITY_VCVARS_VER: '14.52'
          BLENDITY_VCVARS_STRICT: '1'
          BLENDITY_PDB: '1'
          BLENDITY_FETCH_OPTIX: '1'
          BLENDITY_NO_LIBS: '1'
        run: |
          Write-Host "Runner $env:ImageOS $env:ImageVersion"
          git rev-parse HEAD
          cmd /d /c "build.bat release all" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path "$env:RUNNER_TEMP/build.log" -Pattern '^\[blendity\] Toolset: 14\.52\.')) {
            throw 'The build did not record MSVC 14.52.'
          }
          foreach ($name in 'blendity_tests','blendity_stress') {
            foreach ($ext in 'exe','pdb') {
              if (!(Test-Path "dist/windows/$name.$ext")) { throw "Missing $name.$ext" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-14.52-with-symbols
          retention-days: 7
          path: |
            dist/windows/*.exe
            dist/windows/*.pdb
            dist/windows/shaders
            dist/windows/licenses
  test:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, stress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f880bb3bdcc4fdb9e5b79a000334598644ab6bd
      - uses: actions/download-artifact@v4
        with:
          name: windows-14.52-with-symbols
          path: dist/windows
      - name: Run existing tests with matching symbols
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP $env:SUITE
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $env:BLENDITY_PROJECT = "$scratch/project"
          $env:BLENDITY_TRASH = "$scratch/trash"
          $env:BLENDITY_TEST_DIR = "$scratch/test"
          $env:BLENDITY_CACHE_DIR = "$scratch/cache"
          $env:_NT_SYMBOL_PATH = "$pwd/dist/windows"
          if ($env:SUITE -eq 'unit') {
            $env:BLENDITY_TEST_RANGE = '1-650'
            $program = "$pwd/dist/windows/blendity_tests.exe"
            $arguments = @()
          } else {
            $program = "$pwd/dist/windows/blendity_stress.exe"
            $arguments = @('--quick','--only','modifiers_ngon','--out',"$scratch/results")
          }
          & $program @arguments 2>&1 | Tee-Object -FilePath "$scratch/test.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $debugger = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
            if (Test-Path $debugger) {
              & $debugger -g -G -o -c 'sxd av;g;kb;q' $program @arguments 2>&1 | Tee-Object -FilePath "$scratch/stack.log"
            }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-14.52-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/${{ matrix.suite }}/*.log
            ${{ runner.temp }}/${{ matrix.suite }}/results/*.md
