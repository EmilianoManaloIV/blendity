# The stack guarantee (the user, 2026-11-08): merging the top pull request of a stack merges every pull request below
# it. Several stacks may be open at once (one per pass): PRs sharing commits not yet on main form one stack, and each
# stack must have exactly one top. tools/dev/stack_check.sh does the check; the fix is
# `FIX=1 bash tools/dev/stack_check.sh` (it merges a stack's other heads into its newest PR's branch).
name: stack

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]

concurrency:
  group: stack
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Each stack's top PR carries the whole stack
        env:
          GH_TOKEN: ${{ github.token }}
          CI: "1"
        run: bash tools/dev/stack_check.sh
