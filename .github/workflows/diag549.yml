# Round 549's diagnosis only (task 0529): on the diag/549-gcc15 branch, never merged. The Linux build of main went red when
# ubuntu-latest became ubuntu-26.04 (GCC 15); this runs that build with debug symbols under valgrind, which names reads of memory
# never written (their values differ from machine to machine).
name: diag549
on:
  push:
    branches: ['diag/549-*']
jobs:
  valgrind:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y g++ valgrind libx11-dev libxi-dev fonts-dejavu-core
      - name: The runner
        run: |
          g++ --version | head -1
          lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: Build (release, with debug symbols)
        env:
          EXTRA_FLAGS: "-g"
        run: ./build.sh release all
      - name: The two tests under valgrind
        continue-on-error: true
        env:
          BLENDITY_PROJECT: /tmp/p
          BLENDITY_TRASH: /tmp/t
          BLENDITY_THREADS: "1"
        run: |
          mkdir -p /tmp/p /tmp/t
          for f in "turning Realtime GI or its settings on" "draw piece window: a 1 x 1.5 m drag"; do
            echo "=== $f"
            BLENDITY_TEST_FILTER="$f" valgrind --error-limit=no --track-origins=yes --num-callers=24 ./dist/linux/blendity_tests > v.log 2>&1 || true
            grep -E 'FAIL|checks,|ERROR SUMMARY' v.log | head -10
            grep -B2 -A26 -E 'uninitiali[sz]ed|Invalid read|Invalid write' v.log | head -400
          done
      - name: Stress curved alone under valgrind
        continue-on-error: true
        env:
          BLENDITY_PROJECT: /tmp/p
          BLENDITY_TRASH: /tmp/t
          BLENDITY_THREADS: "1"
        run: |
          mkdir -p /tmp/p /tmp/t
          valgrind --error-limit=no --track-origins=yes --num-callers=24 ./dist/linux/blendity_stress --quick --only curved --out /tmp/o1 > vc.log 2>&1 || true
          grep -E 'ERROR SUMMARY|torus|cylinder' vc.log | head -10
          grep -B2 -A26 -E 'uninitiali[sz]ed|Invalid read|Invalid write' vc.log | head -500
